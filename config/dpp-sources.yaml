# Registre des sources - DPP Battery Intelligence (F-01)
# Fiabilite = tier (deterministe). Edite ce fichier sans toucher au code de collecte.
#   T1 Officiel / juridique (fait)
#   T2 Normalisation / institutionnel (haute)
#   T3 Experts / cabinets (interpretation)   -> Phase 3
#   T4 Social / presse (a corroborer)        -> Phase 3
# poles : reglementaire | normalisation | institutionnel | experts | social
# methode : eurlex-rss | eping-api | institutional-scrape
# NOTE 2026-06-03 : EUR-Lex ne fournit pas de RSS par requete sans login (flux Cellar trop
#   larges) -> les sources EUR-Lex passent en institutional-scrape sur pages server-rendered.
#   ePing OMC n'a pas d'API publique sans cle (cf. apiportal.wto.org) -> scrape degrade,
#   integration API a faire en Phase 3.

sources:
