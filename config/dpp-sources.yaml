    nom: "EUR-Lex - Reglement (UE) 2023/1542 (batteries), texte en vigueur"
    url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R1542"
    pole: reglementaire
    tier: T1
    methode: institutional-scrape
    frequence: daily

