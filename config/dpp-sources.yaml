# Registre des sources - DPP Battery Intelligence (F-01)
# Fiabilite = tier (deterministe). Edite ce fichier sans toucher au code de collecte.
#   T1 Officiel / juridique (fait)
#   T2 Normalisation / institutionnel (haute)
#   T3 Experts / cabinets (interpretation)   -> Phase 3
#   T4 Social / presse (a corroborer)        -> Phase 3
# poles : reglementaire | normalisation | institutionnel | experts | social
# methode : eurlex-rss | eurlex-cellar | eping-api | institutional-scrape | circabc-api
# NOTE 2026-06-21 : EUR-Lex bascule sur eurlex-cellar (SPARQL public CELLAR, donnees
#   structurees par CELEX, sans auth). url = seed `cellar:{family|based-on}:{CELEX}`.
#   ePing OMC reste en institutional-scrape (fallback) tant que la cle WTO n'est pas obtenue ;
#   une fois la cle en place -> methode eping-api + endpoint api.wto.org (gateway confirme :
#   401 "missing subscription key", en-tete Ocp-Apim-Subscription-Key via env WTO_API_KEY).
#   Portail d'abonnement presume apiportal.wto.org (non sonde, deduction Azure APIM standard).
#   (Avant : tout en scrape, NOTE 2026-06-03.)

sources:
  - id: eurlex-32023R1542
    nom: "EUR-Lex - Reglement (UE) 2023/1542 (batteries), texte en vigueur + consolidations"
    # Seed CELLAR mode `family` : le texte de base et ses versions consolidees (un item par version).
    url: "cellar:family:32023R1542"
    pole: reglementaire
    tier: T1
    methode: eurlex-cellar
    frequence: daily

  - id: eurlex-actes-delegues
    nom: "EUR-Lex - Actes delegues et d'execution lies au reglement batteries"
    # Seed CELLAR mode `based-on` : les actes delegues / d'execution bases sur 32023R1542.
    url: "cellar:based-on:32023R1542"
    pole: reglementaire
    tier: T1
    methode: eurlex-cellar
    frequence: daily

  - id: eping-omc-batteries
    nom: "ePing OMC - Notifications TBT batteries (scrape degrade, fallback)"
    # Reste en scrape tant que la cle WTO n'est pas obtenue (cf. NOTE en tete). Une fois la cle
    # en place : methode eping-api + url endpoint api.wto.org (collectEping lit WTO_API_KEY).
    url: "https://eping.wto.org/en/Search/Index?domainIds=2"
    pole: reglementaire
    tier: T1
    methode: institutional-scrape
    frequence: daily

  - id: dg-envi-batteries
    nom: "DG ENVI - Batteries et dechets de batteries"
    url: "https://environment.ec.europa.eu/topics/waste-and-recycling/batteries_en"
    pole: institutionnel
    tier: T2
    methode: institutional-scrape
    frequence: weekly

  - id: cen-cenelec-jtc24
    nom: "CEN-CENELEC JTC 24 - Normalisation batteries / DPP"
    url: "https://www.cencenelec.eu/areas-of-work/cen-cenelec-topics/batteries/"
    pole: normalisation
    tier: T2
    methode: institutional-scrape
    frequence: weekly

  - id: jrc-batteries
    nom: "JRC - Joint Research Centre, batteries"
    url: "https://joint-research-centre.ec.europa.eu/jrc-highlights-report-2024/batteries_en"
    pole: institutionnel
    tier: T2
    methode: institutional-scrape
    frequence: weekly

  - id: din-batteries
    nom: "DKE/DIN - Normalisation allemande, reglement batteries UE 2023/1542"
    url: "https://www.dke.de/de/arbeitsfelder/components-technologies/news/die-europaeische-batterieverordnung-kommt"
    pole: normalisation
    tier: T2
    methode: institutional-scrape
    frequence: weekly

  - id: battery-pass
    nom: "Battery Pass - Consortium DPP batterie"
    url: "https://thebatterypass.eu/"
    pole: institutionnel
    tier: T2
    methode: institutional-scrape
    frequence: weekly

  - id: circabc-espr
    nom: "CIRCABC - Commission ESPR / DPP (groupe officiel)"
    # App Angular, scrape classique impossible. Utiliser API REST CIRCABC
    # ou Playwright. Watcher n8n a cabler (mission RC2).
    url: "https://circabc.europa.eu/ui/group/418195ae-4919-45fa-a959-3b695c9aab28/library"
    pole: reglementaire
    tier: T1
    methode: circabc-api
    frequence: daily
